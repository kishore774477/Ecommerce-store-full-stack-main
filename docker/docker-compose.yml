services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - ECOM_DATA_DIR=/data
    volumes:
      - store-data:/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - ECOM_DATA_DIR=/data
      - SECRET_KEY=change-me-in-production
    volumes:
      - store-data:/data

# Both services share one data volume, so orders placed in the UI show up in the API.
volumes:
  store-data:
